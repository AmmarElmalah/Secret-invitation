<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question 💕</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe6e9 0%, #ffe5f1 100%);
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
      width: 90%;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
    }

    .img-container img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      color: #d63384;
      font-size: 1.6rem;
      margin-bottom: 0.8rem;
    }

    p {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      position: relative;
      min-height: 60px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s;
    }

    .yes-btn, .submit-btn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      width: 100%;
    }

    .yes-btn:hover, .submit-btn:hover {
      background-color: #ff758f;
      transform: scale(1.05);
    }

    .no-btn {
      background-color: #f8f9fa;
      color: #495057;
      border: 1px solid #ced4da;
      z-index: 999;
      transition: left 0.2s ease, top 0.2s ease;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-weight: bold;
      color: #495057;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #ffccd5;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
      background: #fff0f3;
      color: #555;
    }

    select:focus, input[type="text"]:focus {
      border-color: #ff4d6d;
      background: #fff;
    }

    .summary-box {
      background: #fff0f3;
      padding: 15px;
      border-radius: 12px;
      text-align: left;
      margin-bottom: 1.5rem;
      color: #555;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .error-msg {
      color: #ff4d6d;
      font-size: 0.8rem;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="img-container">
      <!-- Displays Curry first -->
      <img id="displayImg" src="curry.jpg" alt="Steph Curry Shooting on the Moon">
    </div>

    <!-- Step 1: Initial Question -->
    <div id="step1" class="step active">
      <h1>Will you go on a date with me? 💕</h1>
      <p>Take your time. Choose carefully!</p>
      
      <div class="buttons">
        <button class="yes-btn" style="width: 45%;" onclick="nextStep()">Yes 💕</button>
        <button class="no-btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()" ontouchstart="moveNoButton()">No 😢</button>
      </div>
    </div>

    <!-- Step 2: Date Details Form -->
    <div id="step2" class="step">
      <h2>Plan Our Date ✨</h2>
      <p>Pick what suits you best:</p>

      <form id="date-form">
        <div data-fs-error></div>

        <!-- Select Day -->
        <div class="form-group">
          <label for="dateSelect">📅 Preferred Day:</label>
          <select id="dateSelect" name="preferred_date" data-fs-field required>
            <option value="" disabled selected>Select a date...</option>
            <option value="Sunday, Oct 25">Sunday, Oct 25</option>
            <option value="Monday, Oct 26">Monday, Oct 26</option>
            <option value="Tuesday, Oct 27">Tuesday, Oct 27</option>
            <option value="Wednesday, Oct 28">Wednesday, Oct 28</option>
            <option value="Thursday, Oct 29">Thursday, Oct 29</option>
            <option value="Friday, Oct 30">Friday, Oct 30</option>
            <option value="Saturday, Oct 31">Saturday, Oct 31</option>
            <option value="Sunday, Nov 1">Sunday, Nov 1</option>
            <option value="Monday, Nov 2">Monday, Nov 2</option>
            <option value="Tuesday, Nov 3">Tuesday, Nov 3</option>
            <option value="Wednesday, Nov 4">Wednesday, Nov 4</option>
            <option value="Thursday, Nov 5">Thursday, Nov 5</option>
            <option value="Friday, Nov 6">Friday, Nov 6</option>
            <option value="Saturday, Nov 7">Saturday, Nov 7</option>
          </select>
          <span class="error-msg" data-fs-error="preferred_date"></span>
        </div>

        <!-- Select Activity -->
        <div class="form-group">
          <label for="activitySelect">🎨 Activity / Activity Idea:</label>
          <select id="activitySelect" name="preferred_activity" data-fs-field required>
            <option value="" disabled selected>What should we do?</option>
            <option value="Dinner">Dinner 🍝</option>
            <option value="Coffee & Walk">Coffee & Walk ☕</option>
            <option value="Cinema">Cinema 🎬</option>
            <option value="Arcade & Games">Arcade & Games 🎮</option>
            <option value="Surprise Me">Surprise me! 😉</option>
          </select>
          <span class="error-msg" data-fs-error="preferred_activity"></span>
        </div>

        <!-- Preferred Location / Time -->
        <div class="form-group">
          <label for="locationInput">📍 Suggested Location / Time:</label>
          <input type="text" id="locationInput" name="preferred_location_time" placeholder="e.g. Quiet place / 6:00 PM" data-fs-field required>
          <span class="error-msg" data-fs-error="preferred_location_time"></span>
        </div>

        <button type="submit" class="submit-btn" data-fs-submit-btn>Confirm Date 🎉</button>
      </form>
    </div>

    <!-- Step 3: Confirmation -->
    <div id="step3" class="step">
      <h2>Yay! It's a Date! 🎉✨</h2>
      <p>Here are the details you picked:</p>
      
      <div class="summary-box" id="summaryBox"></div>

      <p style="font-weight: bold; color: #ff4d6d;">Can't wait! See you soon ❤️</p>
    </div>
  </div>

  <script>
    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      
      // Calculate max available width/height within the viewport
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      // Generate safe random coordinates within screen bounds
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      // Apply fixed positioning so it escapes the card and moves freely around screen
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    function nextStep() {
      // Changes image to Jimmy Butler upon clicking "Yes"
      document.getElementById('displayImg').src = 'jimmy.jpg';
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
    }

    // Initialize Formspree AJAX SDK
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { 
      formElement: '#date-form', 
      formId: 'xbglrqbj',
      onSuccess: function() {
        const date = document.getElementById('dateSelect').value;
        const activity = document.getElementById('activitySelect').value;
        const location = document.getElementById('locationInput').value;

        // Render summary screen
        const summaryBox = document.getElementById('summaryBox');
        summaryBox.innerHTML = `
          📌 <b>Date:</b> ${date}<br>
          🎯 <b>Activity:</b> ${activity}<br>
          📍 <b>Location/Time:</b> ${location}
        `;

        // Switch to celebration view
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');

        // Trigger confetti
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
